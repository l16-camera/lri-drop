name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Frontend (Vite + Svelte) ─────────────────────────────────────────
  frontend:
    name: Frontend · lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 3

  # ── Rust: fmt + clippy (once) ────────────────────────────────────────
  rust-check:
    name: Rust · fmt & clippy
    runs-on: macos-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Checkout luminat (light crate)
        uses: actions/checkout@v4
        with:
          repository: isamarin/luminat
          path: vendor/luminat

      - name: Verify light path
        run: test -f vendor/luminat/light/Cargo.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Frontend dist (for tauri-build)
        run: npm ci && npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: cargo fmt
        # Only this package — do not reformat path-dep luminat sources
        run: cargo fmt -p lri-drop -- --check

      - name: cargo clippy
        # --no-deps: only lint this app, not luminat path deps
        run: cargo clippy -p lri-drop --all-targets --no-deps -- -D warnings

  # ── Release binaries: macOS · Windows · Linux ────────────────────────
  rust-build:
    name: Build · ${{ matrix.name }}
    needs: [frontend, rust-check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS aarch64
            os: macos-latest
            artifact: lri-drop-macos-aarch64
            binary: target/release/lri-drop
          - name: Windows x64
            os: windows-latest
            artifact: lri-drop-windows-x64
            binary: target/release/lri-drop.exe
          - name: Linux x64
            os: ubuntu-latest
            artifact: lri-drop-linux-x64
            binary: target/release/lri-drop
    steps:
      - uses: actions/checkout@v4

      - name: Checkout luminat (light crate)
        uses: actions/checkout@v4
        with:
          repository: isamarin/luminat
          path: vendor/luminat

      - name: Verify light path
        shell: bash
        run: test -f vendor/luminat/light/Cargo.toml

      - name: Install Linux WebKit / GTK (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Frontend dist (for tauri-build)
        run: npm ci && npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true
          key: build-${{ matrix.os }}

      - name: cargo build --release
        run: cargo build --release -p lri-drop

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          retention-days: 14
          if-no-files-found: error

  # ── Optional: full Tauri bundles on tags (all platforms) ─────────────
  tauri-bundle:
    name: Tauri · ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    needs: [frontend, rust-check, rust-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: -- --bundles app
          - name: Windows
            os: windows-latest
            args: -- --bundles nsis
          - name: Linux
            os: ubuntu-latest
            args: -- --bundles deb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: isamarin/luminat
          path: vendor/luminat

      - name: Install Linux WebKit / GTK (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: tauri-${{ matrix.os }}

      - name: Install deps
        run: npm ci

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
